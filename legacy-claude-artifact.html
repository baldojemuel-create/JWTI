html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,"Times New Roman",serif}
h1,h2,h3,.sans,button,input,select,label,th{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
h1{font-size:20px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:42px;height:42px;flex:none;background:var(--logo) center/contain no-repeat}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.x{color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.big{font-size:34px;font-weight:700;font-family:system-ui,sans-serif;line-height:1}
.pass{color:var(--acc)}.fail{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
td input{width:70px;padding:6px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-family:system-ui,sans-serif;margin:0 6px 6px 0;cursor:pointer;background:var(--bg)}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#d6b866;--brand:#231a3b}}
:root[data-theme="dark"]{--gold:#d6b866;--brand:#231a3b}
body{font-family:var(--ui)}
h1,h2,h3,.sans,button,input,select,label,th{font-family:var(--ui)}
h1,h2{font-family:var(--serif);font-weight:600}
h2{font-size:19px}
.big{font-family:var(--serif);font-weight:600}
.card{border-radius:12px;padding:20px}
header{background:var(--card);border:1px solid var(--line);border-bottom:2px solid var(--gold);border-radius:12px;padding:10px 16px}
header h1{font-size:19px}
header h1::before{width:34px;height:34px}
button{border-radius:8px;font-weight:500}
button.p{background:var(--acc);border-color:var(--acc)}
button:hover{border-color:var(--acc)}
:is(button,input,select):focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:focus,select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.tabs{background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line);gap:4px}
.tabs button{border:0;background:transparent;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--acc);color:var(--accink)}
th{font-size:12px;font-weight:600;color:var(--mut)}
tr:nth-child(even) td{background:color-mix(in srgb,var(--acc) 4%,transparent)}
.chip{padding:5px 12px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);max-width:980px;margin:12px auto 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.split>.card{border:0;border-radius:0;max-width:none!important;margin:0!important;align-self:center;padding:28px}
.hero{background:var(--brand);color:var(--on-brand);padding:40px 34px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.hlogo{width:150px;height:150px;background:var(--logoL) center/contain no-repeat}
.hero h1{display:block;font-size:clamp(24px,3.2vw,34px);line-height:1.15;color:#fff;margin:0}
.hero h1::before{display:none}
.hero .vs{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.55;margin:16px 0 4px}
.hero .ref{margin:0;font-size:13px;color:var(--gold)}
.hero.c{flex-direction:row;align-items:center;padding:18px 22px;border-radius:12px;margin:0 auto 14px;max-width:720px}
.hero.c .hlogo{width:64px;height:64px;flex:none}
.hero.c h1{font-size:22px}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:8px 0 24px}
@media (max-width:760px){.split{grid-template-columns:1fr}.hero{padding:22px 20px;flex-direction:row;align-items:center}.hlogo{width:72px;height:72px;flex:none}.hero .vs,.hero .ref{display:none}.hero h1{font-size:22px}}
.reps{display:grid;gap:22px 28px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.reps h3{font-size:14px;margin:0 0 8px;font-family:var(--ui)}
.rb{display:grid;grid-template-columns:minmax(90px,1.3fr) 1fr auto;align-items:center;gap:10px;font-size:13px;padding:3px 0}
.rb .bar{margin:0}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
#sig{display:block;width:100%;max-width:420px;aspect-ratio:10/3;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.nav{overflow-x:auto;flex-wrap:nowrap;margin-bottom:14px}.nav button{white-space:nowrap}
.badge{background:var(--gold);color:#1b1300;border-radius:99px;padding:0 7px;font-size:11px;margin-left:4px}
